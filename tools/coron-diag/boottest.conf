CONFIG_CORON_DIAG_BOOT=y
# No timer-driven monitor may reset the chip before the instrument's net does: the freeze detector
# would reboot 10 s after its last feed (before the 15 s workqueue deadline) without recording a
# PC. The fatal detector stays on (it only reacts to faults, records PC/LR, then reboots; with it
# off the config repo's fatal_reboot.c would reboot without any record). The three confirmed stall
# images predate the watchdog module (added in 162637f), so they had no freeze detector either.
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n

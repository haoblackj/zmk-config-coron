# The ONE lab recording image (2026-10-09, leader: measure once, take everything, no flash wear).
# Production config + boot-entry clean + breadcrumb (prod-entry.conf) + the overhead assert ON (so a
# late link-layer prepare is a recorded crash, not a silent skip) + diag_lab.c (latency probe, 1 ms
# activity timeline, printk capture, up to 4 crash records kept across reboots in RAM).
# Right: build with the studio-rpc-usb-uart snippet; left: add left-console.conf. Never leave it on
# the device after the measurement.
CONFIG_CORON_DIAG_ENTRY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=y
CONFIG_CORON_DIAG_LAB=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_THREAD_NAME=y

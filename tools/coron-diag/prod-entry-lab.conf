# The ONE lab recording image (2026-10-09, leader: measure once, take everything, no flash wear).
# v3 (evening): production config + boot-entry clean + breadcrumb (prod-entry.conf) + diag_lab.c
# (lateness probe, activity timeline, ISR/thread trace, controller scheduling trace via --wrap,
# printk capture, 3 records kept across reboots in RAM). The controller runs exactly as in
# production: the overhead assert OFF (a late prepare skips the event and the wrapper records that
# moment without a reboot) and NO zero-latency IRQs (v2 had both on; its ZLI made the radio
# interrupts unmaskable, which production does not have, and hid SWI4 from the trace).
# Right: build with the studio-rpc-usb-uart snippet; left: add left-console.conf. Never leave it on
# the device after the measurement.
CONFIG_CORON_DIAG_ENTRY=y
CONFIG_CORON_DIAG_ENTRY_CRUMB=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
CONFIG_CORON_DIAG_LAB=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_THREAD_NAME=y
# ISR entry/exit and thread-switch hooks (user-defined functions in diag_lab.c; every other tracing
# point is a call into an empty weak function)
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
CONFIG_TRACING_ISR=y
CONFIG_TRACING_THREAD=y
CONFIG_TRACING_WORK=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_NET_SOCKETS=n
CONFIG_TRACING_GPIO=n
# v2's masked-region sampler needed CONFIG_ZERO_LATENCY_IRQS=y; v3 keeps the production interrupt
# layout (the sampler is compiled out when ZLI is off)
CONFIG_ZERO_LATENCY_IRQS=n

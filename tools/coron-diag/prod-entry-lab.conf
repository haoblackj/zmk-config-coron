# The ONE lab recording image (2026-10-09, leader: measure once, take everything, no flash wear).
# Production config + boot-entry clean + breadcrumb (prod-entry.conf) + the overhead assert ON (so a
# late link-layer prepare is a recorded crash, not a silent skip) + diag_lab.c (lateness probe,
# activity timeline, ISR/thread trace, masked-region sampler, printk capture, 4 crash records kept
# across reboots in RAM). Right: build with the studio-rpc-usb-uart snippet; left: add
# left-console.conf. Never leave it on the device after the measurement.
CONFIG_CORON_DIAG_ENTRY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=y
CONFIG_CORON_DIAG_LAB=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_THREAD_NAME=y
# ISR entry/exit and thread-switch hooks (user-defined functions in diag_lab.c; every other tracing
# point is a call into an empty weak function)
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
CONFIG_TRACING_ISR=y
CONFIG_TRACING_THREAD=y
CONFIG_TRACING_WORK=n
CONFIG_TRACING_SEMAPHORE=n
CONFIG_TRACING_MUTEX=n
CONFIG_TRACING_CONDVAR=n
CONFIG_TRACING_QUEUE=n
CONFIG_TRACING_FIFO=n
CONFIG_TRACING_LIFO=n
CONFIG_TRACING_STACK=n
CONFIG_TRACING_MESSAGE_QUEUE=n
CONFIG_TRACING_MAILBOX=n
CONFIG_TRACING_PIPE=n
CONFIG_TRACING_HEAP=n
CONFIG_TRACING_MEMORY_SLAB=n
CONFIG_TRACING_TIMER=n
CONFIG_TRACING_EVENT=n
CONFIG_TRACING_POLLING=n
CONFIG_TRACING_PM=n
CONFIG_TRACING_SYSCALL=n
CONFIG_TRACING_NETWORKING=n
CONFIG_TRACING_NET_SOCKETS=n
CONFIG_TRACING_GPIO=n
# the masked-region sampler runs as a zero-latency IRQ (hardware priority above BASEPRI)
CONFIG_ZERO_LATENCY_IRQS=y
CONFIG_ZERO_LATENCY_LEVELS=1

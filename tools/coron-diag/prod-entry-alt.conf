# The production image with the boot-entry clean and the breadcrumb (prod-entry.conf), compiled
# with speed optimizations so that every flash page differs from the normal build. Used only as the
# partner image in the overnight alternate-write loop (the bootloader skips pages whose content is
# unchanged, so a real write needs two images that differ everywhere). Same source, same Kconfig
# otherwise; the morning leaves the device on the normal build.
CONFIG_CORON_DIAG_ENTRY=y
CONFIG_SPEED_OPTIMIZATIONS=y

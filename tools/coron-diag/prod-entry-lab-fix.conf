# Lab image v7 + the fix candidate (2026-10-09 21:1x): the right half without the split central's
# battery-level fetching and proxy. ZMK's split BLE central (src/split/bluetooth/central.c, the
# disconnected callback) queues a "battery level 0" event for EVERY disconnected connection with
# source = peripheral_slot_index_for_conn(conn); for the PC's connection that is -EINVAL, which
# becomes 234 in the uint8_t source, and src/split/central.c:62 writes
# peripheral_battery_levels[234] = 0 with no bounds check: 234 bytes past a 1-byte array, which in
# this image is the Bluetooth controller's preempt_req (lll.c). Both options off compile the
# whole path out. The DWT watchpoint of v7 stays on preempt_req to prove the write is gone
# (zero hits = 0 over the reconnect stimulus).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n

# Lab image for "what delays the link layer's prepare?" (2026-10-09, leader: 「遅れの原因を測ろう」).
# prod-entry-ovh.conf (production image + breadcrumb + overhead assert ON) plus diag_lat.c: a 1 kHz
# interrupt-latency probe at the LLL's level and the controller's assert sink, both recording into
# the DIAGREC RAM that the next boot's console dump prints. Never leave this image on the device.
CONFIG_CORON_DIAG_ENTRY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=y
CONFIG_CORON_DIAG_LAT=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_THREAD_NAME=y

# Test image for the overhead-assert hypothesis (2026-10-09): the production image with the
# boot-entry clean and the breadcrumb (prod-entry.conf), with the link-layer "overhead start"
# assert turned back ON. Every field stall before 2026-10-07 16:28 ran with this assert on (it was
# the Kconfig default; the production conf set it to n at 16:28 that day after the 16:16 fatal in
# lll_central.c), and every lab boot since then ran with it off. Alternated with the normal B image
# (assert off) so each loop carries its own control. Never leave this image on the device.
CONFIG_CORON_DIAG_ENTRY=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=y

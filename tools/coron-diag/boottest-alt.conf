CONFIG_CORON_DIAG_BOOT=y
# Same test aid, different code everywhere: alternating this image with the size-optimized one
# makes the bootloader erase and rewrite (almost) every page on each flash.
CONFIG_SPEED_OPTIMIZATIONS=y
# See boottest.conf: no timer-driven monitor may reset the chip before the instrument's net does.
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n

manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: keebJP
      url-base: https://github.com/keebJP
    - name: haoblackj
      url-base: https://github.com/haoblackj
    - name: t-ogura
      url-base: https://github.com/t-ogura
  projects:
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork（main 系列、Zephyr 4.1）
    - name: zmk
      remote: cormoran
      revision: main+dya
      import:
        file: app/west.yml
    # Zephyr: ZMK 本家の版（cormoran 版 ZMK の app/west.yml が指すものと同じ）。
    # cormoran fork（v4.1.0+zmk-fixes+nrf-half-duplex-uart）との差は、Coron が使わない有線分割用の
    # 半二重 UART ドライバと、本家に 2026-08-14 に入った Bluetooth コントローラの修正2件
    # （分割セントラルが固まる件、接続パラメータ更新時にペリフェラルが落ちる件）だけ。
    - name: zephyr
      remote: zmkfirmware
      revision: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    # DYA Studio モジュール（すべて cormoran リポジトリ）
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main
    - name: zmk-pmw3610-driver
      remote: haoblackj
      revision: e0cd6714f3725b682d4fcf193ffddf3c0cf337c9 # feat/zephyr-4.1-compat: fix/polling-rate-125-sw-drop (2936de8) + compatible "pixart,pmw3610-alt" for Zephyr 4.1
    - name: zmk-input-processor-deadzone
      remote: haoblackj
      revision: 7b6578dfafcd43ee4e8a5e20f0e6f978065be43b # fix/deadzone-flush-instead-of-discard: hysteresis filter instead of threshold+timeout gate
  self:
    path: config

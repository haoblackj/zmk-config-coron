manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    # - name: zmkfirmware
    #   url-base: https://github.com/zmkfirmware
    - name: keebJP
      url-base: https://github.com/keebJP
    - name: haoblackj
      url-base: https://github.com/haoblackj
    - name: t-ogura
      url-base: https://github.com/t-ogura
  projects:
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    # DYA Studio モジュール（すべて cormoran リポジトリ）
    - name: zmk-module-ble-management
      remote: cormoran
      revision: zmk-v0.3.0.0
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: zmk-v0.3.0.0
    - name: zmk-pmw3610-driver
      remote: haoblackj
      revision: 66b38d92c316281cb4d408d7a02c9d17a5cbca77 # fix/polling-rate-125-sw-drop: also removed stale-residue clear that dropped sparse slow motion
    - name: zmk-input-processor-deadzone
      remote: haoblackj
      revision: 7b6578dfafcd43ee4e8a5e20f0e6f978065be43b # fix/deadzone-flush-instead-of-discard: hysteresis filter instead of threshold+timeout gate
  self:
    path: config

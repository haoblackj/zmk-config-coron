CONFIG_ZMK_KEYBOARD_NAME="coron"

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE=y



CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_CPI_DIVIDOR=1
# CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_ORIENTATION_0=y
# CONFIG_PMW3610_SNIPE_CPI=800
# CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=y
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700

CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

CONFIG_PMW3610_SMART_ALGORITHM=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# ========================================
# ZMK Studio（必須ベース）
# ========================================
CONFIG_ZMK_STUDIO=y
# 注意: CONFIG_ZMK_STUDIO_LOCKING=n を設定しないでください。
# Studio Locking は BLE 接続に必要なため、デフォルトの y を維持する必要があります。
# 詳細は「BLE 接続」セクションを参照。

# BLE 接続スロット（プロファイル + Peripheral + Studio）
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ========================================
# DYA Studio モジュール（Central 側）
# ========================================
# BLE 管理
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# バッテリー履歴
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
# デフォルトでは USB 給電中はバッテリー履歴の記録がスキップされます。
# USB 接続中もバッテリー履歴を記録したい場合は n に設定してください。
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# Settings RPC（アイドル/スリープ設定）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split イベントリレー（Central <-> Peripheral 設定同期）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# Custom Settings（Runtime Combo / Runtime Input Processor の保存先）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Runtime Combo（コンボを DYA Studio から変更）
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16

# Runtime Macro（マクロを DYA Studio から作成・変更。キーには &rmacro <スロット番号> を割り当てる）
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y

# Custom Studio Protocol を複数使う場合のスタックとバッファ（DYA Studio 開発者ガイドの推奨値）
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256

# Runtime Input Processor（トラックボール設定を DYA Studio から変更）
# トラックボール/ポインティングデバイスがある場合のみ必要
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# トラブルシューティング（診断）ページ
# デバイス情報: ビルドの版、リセット原因、デバイスの初期化結果
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
# ウォッチドッグ: 固まり（ワークキューが 10 秒止まる）と致命的エラーを記録して再起動する。
# 致命的エラーで再起動する src/fatal_reboot.c の代わりになる（CMakeLists.txt を参照）。
# 左手側の記録は、左右間のリレーで右手側から読む。
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 設定保存の高速化
# バッテリー履歴が履歴1件ごとに設定項目を作るので、保存済みの項目は数百件になる。
# キャッシュが無いと、設定を1回保存するたびに項目名を全件読みに行き、約1秒固まる
# （実測: 258 件で保存1回 約1,000〜1,900 ms、キャッシュ有りで 約10 ms）。
# その間に Bluetooth の接続が切れたり、キーの報告が届かなかったりする。
# 項目数がキャッシュのサイズを超えると元の遅さに戻るので、増えたらサイズも上げる。
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=512
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=512

# 接続のたびに設定領域を全件読みに行くのをやめる
# 既定（遅延読み込み）では、ペアリング済みの相手が接続するたびに、通知の購読状態を
# 設定領域から読み直す。保存済みの項目が数百件あると、この読み直しに約 0.7 秒かかり、
# そのあいだ Bluetooth の受信スレッドが CPU を占有して、キー処理が止まる
# （実測: 258 件で、接続1回ごとに 704〜714 ms の停止）。
# 無効にすると、購読状態は起動時に一度だけ読み込まれる。
CONFIG_BT_SETTINGS_CCC_LAZY_LOADING=n

# 無線の準備が間に合わなかったときに、致命的エラーにせずそのイベントだけ飛ばす
# 既定（y）では、Bluetooth コントローラが無線のイベントの準備に間に合わないと検査（LL_ASSERT_OVERHEAD）で
# 致命的エラーになり、再起動する。そのあいだキーが届かず、つなぎ直しまで待たされる
# （2026-10-07 に右手側で lll_central.c:252、2026-10-05 に左手側で lll_peripheral.c:342 を観測）。
# 無効にすると、遅れたイベントを1回飛ばして続ける（Zephyr の Kconfig の説明による）。
# この設定はコントローラの「Advanced features」のメニューの中にあり、メニューを見えるようにしないと値を変えられない。
# 見えるようにするだけで、ほかの設定の値は変わらない。
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

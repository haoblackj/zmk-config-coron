CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_POINTING=y

# バッテリー履歴（Peripheral 側）
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC（Peripheral 側）
CONFIG_ZMK_SETTINGS_RPC=y

# Split イベントリレー（Peripheral 側）
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Custom Settings（Peripheral 側、Central からのリレーを受ける）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# ウォッチドッグ（Peripheral 側）: 固まりと致命的エラーを自分で記録して再起動する。
# 記録は右手側の DYA Studio から左右間のリレーで読む。
CONFIG_ZMK_WATCHDOG=y

# 設定の永続化
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 設定保存の高速化
# バッテリー履歴が履歴1件ごとに設定項目を作るので、保存済みの項目は数百件になる。
# キャッシュが無いと、設定を1回保存するたびに項目名を全件読みに行き、約1秒固まる
# （実測: 258 件で保存1回 約1,000〜1,900 ms、キャッシュ有りで 約10 ms）。
# その間に Bluetooth の接続が切れたり、キーの報告が届かなかったりする。
# 項目数がキャッシュのサイズを超えると元の遅さに戻るので、増えたらサイズも上げる。
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=512
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=512

# 無線の準備が間に合わなかったときに、致命的エラーにせずそのイベントだけ飛ばす
# 既定（y）では、Bluetooth コントローラが無線のイベントの準備に間に合わないと検査（LL_ASSERT_OVERHEAD）で
# 致命的エラーになり、再起動する。そのあいだキーが届かず、つなぎ直しまで待たされる
# （2026-10-07 に右手側で lll_central.c:252、2026-10-05 に左手側で lll_peripheral.c:342 を観測）。
# 無効にすると、遅れたイベントを1回飛ばして続ける（Zephyr の Kconfig の説明による）。
# この設定はコントローラの「Advanced features」のメニューの中にあり、メニューを見えるようにしないと値を変えられない。
# 見えるようにするだけで、ほかの設定の値は変わらない。
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
